name: Sync calendar dependency lockfile
on:
  push:
    paths:
      - Cargo.toml
      - .github/workflows/calendar-deps.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Add only newly required dependencies to the lockfile
        run: cargo update --workspace
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Lock calendar's lunar, timezone and international holiday crates"
          git push origin HEAD:main
