[package]
name = "island-lab"
version = "0.1.4"
edition = "2021"

[features]
# Explicit recording fixture; never enabled in normal builds.
demo-power = []

[build-dependencies]
embed-resource = "3"

[dependencies]
raw-window-handle = "0.6"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.31", features = ["svg"] }
sysinfo = "0.33"
battery = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
rand = "0.9"
regex = "1"
serde_json = "1.0.154"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
webbrowser = "1"
tempfile = "3"
time = { version = "0.3", features = ["local-offset"] }
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1.65"
holidays-rs = "0.8"
lunar-lite = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "socks", "system-proxy"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["net", "rt", "time"] }
jsonpath_lib = "0.3"
rfd = { version = "0.15", default-features = false, features = ["async-std", "xdg-portal"] }
feed-rs = { version = "3", features = ["sanitize"] }
ammonia = "4.2.5"
arboard = "3.7.0"
imap = "2.4.1"
mailparse = "0.15"
native-tls = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
zbus = { version = "5", default-features = true }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.5"
block2 = "0.5"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSBitmapImageRep", "NSEvent", "NSGraphics", "NSImage", "NSImageRep", "NSView", "NSWindow", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSGeometry"] }
plist = "1"
objc2-web-kit = { version = "0.2.2", default-features = false, features = ["objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKNavigation", "WKPreferences", "WKWebpagePreferences"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
