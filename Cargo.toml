[package]
name = "island-lab"
version = "0.1.0"
edition = "2021"

[features]
# Explicit recording fixture; never enabled in normal builds.
demo-power = []

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.31", features = ["svg"] }
sysinfo = "0.33"
battery = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
serde_json = "1.0.154"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
webbrowser = "1"
tempfile = "3"
time = { version = "0.3", features = ["local-offset"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots", "socks", "system-proxy"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
zbus = { version = "5", default-features = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_WinRT",
] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
regex = "1"
libc = "0.2"
objc2 = "0.5"
block2 = "0.5"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSEvent", "NSView", "NSWindow", "block2"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSGeometry"] }
plist = "1"
raw-window-handle = "0.6"

[dev-dependencies]
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
