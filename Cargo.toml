[package]
name = "island-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
sysinfo = "0.33"
regex = "1"
battery = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSGeometry"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
